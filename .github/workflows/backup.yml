name: backup-db

# Bản sao lưu độc lập, không phụ thuộc snapshot của nhà cung cấp. Snapshot nằm
# cùng chỗ với database: một lần lỡ tay xóa cả service là mất cả hai.
#
# KHÔNG bao gồm ẢNH hỏng hóc — ảnh nằm trên Volume của service `v`, không nằm
# trong database. Muốn sao lưu ảnh thì phải làm riêng. Nói ra ở đây vì "đã có
# backup hằng ngày" rất dễ được hiểu là đã có backup mọi thứ.
#
# Bản dump chứa DỮ LIỆU CÁ NHÂN THẬT: họ tên, số điện thoại, email, CCCD của cư
# dân, toàn bộ hóa đơn, bản ghi thanh toán, VÀ băm mật khẩu trong schema auth.
# Vì vậy:
#   - KHÔNG commit vào git. Nó nằm ở artifact của workflow, hết hạn tự xóa.
#   - Ai có quyền đọc repo là tải được artifact. Giữ repo riêng tư.

on:
  schedule:
    - cron: '30 18 * * *'      # 01:30 giờ VN — sau cron nhắc nợ, trước giờ làm việc
  workflow_dispatch:            # chạy tay khi cần bản dump ngay

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm secret trước khi làm gì khác
        env:
          DB_URL: ${{ secrets.DATABASE_URL_BACKUP }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::Thiếu secret DATABASE_URL_BACKUP."
            echo "Lấy ở Railway > service Postgres > Variables > DATABASE_PUBLIC_URL."
            echo "PHẢI là bản PUBLIC: địa chỉ *.railway.internal chỉ sống trong mạng nội bộ"
            echo "của Railway, runner của GitHub không nối tới được."
            exit 1
          fi

      # pg_dump phải BẰNG HOẶC MỚI HƠN server, nếu không nó từ chối chạy.
      # Runner mặc định chỉ có client 16 -> thêm kho PGDG cho chắc.
      - name: Cài postgresql-client 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Dump
        env:
          DB_URL: ${{ secrets.DATABASE_URL_BACKUP }}
        run: |
          set -euo pipefail
          TEN="vbuilding-$(date -u +%Y%m%d-%H%M).dump"
          echo "TEN=$TEN" >> "$GITHUB_ENV"

          # --format=custom: nén sẵn và khôi phục chọn lọc được bằng pg_restore.
          # --no-owner --no-privileges: khôi phục sang database khác không vấp
          # chuyện role không tồn tại — mà khôi phục sang chỗ khác chính là tình
          # huống cần backup nhất. Dựng lại role bằng railway/00_compat.sql, rồi
          # auth_hooks.sql cấp lại quyền.
          #
          # schema `auth` PHẢI có mặt: từ khi tự dựng lớp đăng nhập, băm mật khẩu
          # nằm ở auth.users. Dump thiếu nó thì bản khôi phục có đủ hóa đơn và
          # công nợ nhưng KHÔNG AI đăng nhập được, kể cả ban quản lý.
          pg_dump "$DB_URL" \
            --format=custom --compress=9 \
            --no-owner --no-privileges \
            --schema=public --schema=auth \
            --file="$TEN"

      # Dump rỗng vẫn là một file, vẫn upload thành công, và ba tháng sau mới
      # phát hiện ra là suốt thời gian đó không có backup nào cả. Đếm số bảng
      # đọc được từ chính bản dump để biết nó có thật sự chứa gì không.
      - name: Kiểm bản dump có nội dung
        run: |
          set -euo pipefail
          KICH_THUOC=$(stat -c%s "$TEN")
          SO_BANG=$(pg_restore --list "$TEN" | grep -c 'TABLE DATA' || true)
          echo "Kích thước: $KICH_THUOC bytes, $SO_BANG bảng có dữ liệu"
          if [ "$KICH_THUOC" -lt 2000 ]; then
            echo "::error::Bản dump chỉ $KICH_THUOC bytes — gần như chắc chắn hỏng."
            exit 1
          fi
          if [ "$SO_BANG" -lt 10 ]; then
            echo "::error::Chỉ thấy $SO_BANG bảng trong bản dump, schema có hơn 20 bảng."
            echo "Nhiều khả năng dump nhầm database hoặc thiếu quyền."
            exit 1
          fi
          # Đếm riêng schema auth: nó chỉ có 2 bảng nên ngưỡng 10 ở trên không
          # bao giờ bắt được trường hợp thiếu đúng nó — mà thiếu đúng nó là bản
          # khôi phục không ai đăng nhập được.
          if ! pg_restore --list "$TEN" | grep -q 'TABLE DATA auth users'; then
            echo "::error::Bản dump không có auth.users. Khôi phục từ bản này thì không ai đăng nhập được."
            exit 1
          fi

      - name: Lưu
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TEN }}
          path: ${{ env.TEN }}
          retention-days: 90        # mức tối đa của GitHub
          if-no-files-found: error
